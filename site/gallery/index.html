const px = n => Math.round(n * 10) / 10;
const clampCss = (lo, slope, hi) => `clamp(${Math.round(lo)}px,${px(slope)}vw,${Math.round(hi)}px)`;

/** 한 블루프린트(타이포그래피 프리셋 + scale 축)의 역할별 크기 값(CSS 문자열). */
function roleSizes(b) {
  const preset = TYPE[b.typography], bodyPx = preset.body, r = Math.max(1.12, preset.ratio + (RATIO_SHIFT[b.scale] ?? 0));
  const out = {};
  const fixedSize = n => ({css: Math.round(n) + 'px', max: n, min: n, fluid: false});
  const fluidSize = (lo, slope, hi) => ({css: clampCss(lo, slope, hi), max: hi, min: lo, fluid: true});
  const resolve = name => {
    if (out[name]) return out[name];
    const role = ROLES[name];
    let v;
    if (role.derive) {
      const [from, k] = role.derive, base = resolve(from);
      v = base.fluid ? fluidSize(base.min * k, base.max * k / 12.8, base.max * k) : fixedSize(base.max * k);
    } else if (role.fixedPx) { const [lo, slope, hi] = role.fixedPx; v = fluidSize(lo, slope, hi); }
    else if (role.fixed) v = fixedSize(role.fixed(bodyPx));
    else if (typeof role.fluid === 'function') { const [lo, slope, hi] = role.fluid(bodyPx); v = fluidSize(lo, slope, hi); }
    else {
      const max = Math.min(role.cap, bodyPx * Math.pow(r, role.exp));
      v = role.fluid ? fluidSize(Math.min(max, Math.max(bodyPx + 2, max * role.min, 0), role.minCap ?? Infinity), max / 12.8, max) : fixedSize(max);
    }
    // 좁은 화면에서도 위계가 뒤집히지 않게: 이 역할의 최솟값은 아래 단계의 값보다 gap px 크다(6차 진단 HIER_INVERT)
    if (role.minAfter && v.fluid) {
      const [below, gap] = role.minAfter, b = resolve(below);
      v = fluidSize(Math.min(v.max, Math.max(v.min, (b.fluid ? b.min : b.max) + gap)), v.max / 12.8, v.max);
    }
    return out[name] = v;
  };
  for (const name of Object.keys(ROLES)) resolve(name);
  return out;
}

const roleVar = name => `--kit-t-${name}`;

/** 서체·역할 크기·자간·행간·굵기 선언. axisVars가 :root에 넣는다. */

  const preset = TYPE[b.typography], sizes = roleSizes(b);

  const floor = ['iowan', 'georgia', 'charter', 'baskerville', 'didone', 'slab'].includes(preset.head) ? 400 : 600;

    `--kit-heading:${STACKS[preset.head]}`, `--kit-font:${STACKS[preset.text]}`, `--kit-mono:${STACKS.mono}`,
    `--kit-hw:${hw}`, `--kit-line:${lh.body}`,

// ---------- CSS lint ----------
const SIZE_OK = /^(inherit|initial|unset|0|1em|100%)$/;
const ROLE_RE = /^var\(--kit-t-([a-z-]+)\)$/;
/** 칸 폭에 맞춰 줄이는 형태: min(역할, 칸 폭 비례). 칸이 좁을 때 큰 글자가 칸을 넘지 않게 하는 것이 목적이다. */
const FIT_RE = /^min\(var\(--kit-t-([a-z-]+)\),.*cqw.*\)$/;

/** CSS 텍스트에서 font-size·font 선언을 검사한다. [{selector, prop, value, reason}]
 *  RAW: 역할이 아닌 크기(px·rem·em·clamp·calc)  ROLE: 알 수 없는 역할  SLOT: 이 역할이 허용되지 않은 자리  SHORTHAND: font 약식 선언은 크기를 숨기므로 금지 */
function lintType(css) {
  const out = [];
  for (const [, selector, body] of css.matchAll(/([^{}]+)\{([^{}]*)\}/g)) {
    const sel = selector.trim().replace(/\s+/g, ' ');
    if (sel.startsWith('@') || sel.startsWith('/*')) continue;
    for (const decl of body.split(/;(?![^(]*\))/)) {
      const i = decl.indexOf(':'); if (i < 0) continue;
      const prop = decl.slice(0, i).trim(), value = decl.slice(i + 1).replace(/!important/, '').trim();
      if (prop === 'font') { if (!/^inherit$/.test(value)) out.push({selector: sel.slice(0, 80), prop, value: value.slice(0, 60), reason: 'SHORTHAND'}); continue; }
      if (prop !== 'font-size') continue;
      if (SIZE_OK.test(value)) continue;
      const m = ROLE_RE.exec(value) ?? FIT_RE.exec(value);
      if (!m) { out.push({selector: sel.slice(0, 80), prop, value: value.slice(0, 60), reason: 'RAW'}); continue; }
      const role = ROLES[m[1]];
      if (!role) { out.push({selector: sel.slice(0, 80), prop, value, reason: 'ROLE'}); continue; }
      if (!role.slots.includes('*') && !role.slots.some(s => sel.includes(s))) out.push({selector: sel.slice(0, 80), prop, value, reason: 'SLOT ' + m[1] + ' ← ' + role.slots.join(' | ')});
    }
  }
  return out;
}

function openViewer(tid, themeId, paletteId) { tplId = tid; tvar = ''; lay = null; bp = K.createBlueprint(tid, themeId, paletteId); sync(); show(bp); viewer.classList.add('open'); document.body.style.overflow = 'hidden'; fitWide(); }
function openPart(type) {
  const spec = K.nodeSpecs[type], base = K.createBlueprint('about-team'); base.pageType = 'general';
  const filler = {type: 'prose', title: '본문', body: '내용'}, ex = structuredClone(spec.example ?? (type === 'plan' ? K.nodeSpecs.pricing.example.children[0] : null));
  if (!ex) { const parent = K.nodeTypes.find(t => K.nodeSpecs[t].example && K.nodeSpecs[t].children?.includes(type)); return openPart(parent); }
  base.tree = {type: 'page', children: type === 'page-header' ? [ex, filler] : [{type: 'page-header', title: spec.label, description: '부품 예시 · ' + type}, ex]};
  if (type === 'toc') base.tree.children.push({type: 'section', title: '첫째', anchor: 'a', children: [filler]}, {type: 'section', title: '둘째', anchor: 'b', children: [filler]});
  tplId = 'about-team'; tvar = ''; lay = null; bp = base; sync(); show(bp); $('#vtitle').textContent = spec.label + ' (' + type + ')'; viewer.classList.add('open'); document.body.style.overflow = 'hidden'; fitWide();
}
$('#close').onclick = () => { viewer.classList.remove('open'); document.body.style.overflow = ''; frame.srcdoc = ''; $('#panel').classList.remove('open'); };

$('#wide').onclick = () => { stage.classList.toggle('wide'); $('#wide').setAttribute('aria-pressed', String(stage.classList.contains('wide'))); fitWide(); };
$('#f-tpl').onchange = e => { tplId = e.target.value; lay = null; bp = make(tplId, bp.theme, bp.palette); sync(); show(bp); };
$('#f-theme').onchange = e => { tvar = ''; bp = make(tplId, e.target.value, bp.palette); sync(); show(bp); };
$('#f-var').onchange = e => { tvar = e.target.value; bp = make(tplId, bp.theme, bp.palette); sync(); show(bp); };
$('#f-lay').onchange = e => { lay = e.target.value ? e.target.value.split(':') : null; bp = make(tplId, bp.theme, bp.palette); sync(); show(bp); };
$('#f-pal').onchange = e => { bp.palette = e.target.value; show(bp); };
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { bp.mode = b.dataset.m; sync(); show(bp); });
$('#dl').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([lastHtml], {type: 'text/html'})); a.download = (tplId || 'page') + '.html'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('#dlj').onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(bp, null, 2)], {type: 'application/json'})); a.download = (tplId || 'page') + '.blueprint.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
addEventListener('resize', fitWide);

$('#counts').innerHTML = [['테마', themes.length], ['팔레트', Object.keys(K.palettes).length], ['템플릿', tpls.length], ['부품', K.nodeTypes.length], ['페이지 유형', Object.keys(K.pageTypes).length], ['축', K.axisOrder.length], ['아이콘', K.iconNames.length], ['규칙', K.rules.length + K.axisBans.length]].map(([a, n]) => '<li>' + a + ' ' + n + '</li>').join('');
renderTemplates(); renderThemes(); renderParts(); renderAxes(); renderRules();
