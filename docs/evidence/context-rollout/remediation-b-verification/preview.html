<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>표 브라우저 검증 미리보기</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font:14px system-ui,sans-serif;background:#f4f6f8}#bar{height:auto;min-height:46px;padding:7px 10px;background:#111827;color:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap}#readout{font:12px ui-monospace,monospace;white-space:pre-wrap}button{padding:6px 10px}iframe{display:block;width:100%;height:calc(100% - 46px);border:0;background:white}</style><div id="bar"><button id="focus">표 영역 포커스</button><button id="scroll">끝 열로 이동</button><span id="readout">측정 준비 중</span></div><iframe id="frame"></iframe><script>
const p = new URLSearchParams(location.search), id=p.get('example'), variant=p.get('variant')||'before', name=p.get('probe');
const url = name ? '/docs/evidence/context-rollout/remediation-b-verification/probes/'+name+'.html' : variant==='before' ? '/site/examples/'+id+'/index.html' : '/docs/evidence/context-rollout/remediation-b-verification/after/'+id+'.html';
const frame=document.querySelector('#frame'), out=document.querySelector('#readout');

const measure=()=>{try{const d=frame.contentDocument,all=[...d.querySelectorAll('table')],index={ 'docs-reference':0,'api-reference':0,'admin-table':0,'sales-dashboard':2 }[id]??0,t=name?all[0]:(variant==='after'?d.querySelector('table[data-table-min]'):all[index]),w=t?.closest('.kit-table-scroll');if(!w||!t){out.textContent='표 미발견';return}const rect=x=>{const r=x.getBoundingClientRect();return {x:+r.x.toFixed(1),y:+r.y.toFixed(1),width:+r.width.toFixed(1),height:+r.height.toFixed(1),right:+r.right.toFixed(1)}};const cells=[...t.querySelectorAll('thead th')].map((e,i)=>({i,label:e.innerText,width:+e.getBoundingClientRect().width.toFixed(1),min:e.getAttribute('data-column-min'),align:getComputedStyle(e).textAlign,wrap:getComputedStyle(e).whiteSpace,paddingInline:getComputedStyle(e).paddingInline,paddingBlock:getComputedStyle(e).paddingBlock}));const desc=[...t.querySelectorAll('[data-column-wrap="words"]')].map(e=>({text:e.innerText.slice(0,50),height:+e.getBoundingClientRect().height.toFixed(1),lineHeight:getComputedStyle(e).lineHeight,wrap:getComputedStyle(e).wordBreak}));const lastCells=[...t.querySelectorAll('tbody tr > :last-child')].map(e=>{const cs=getComputedStyle(e),height=e.getBoundingClientRect().height,line=parseFloat(cs.lineHeight)||0;return{text:e.innerText.slice(0,60),height:+height.toFixed(1),lineHeight:cs.lineHeight,paddingBlock:cs.paddingBlock,estimatedLines:line?Math.max(1,Math.round((height-2*parseFloat(cs.paddingBlock)-1)/line)):null}});const dataCells=[...t.querySelectorAll('tbody tr')].map((r,row)=>[...r.cells].map((e,col)=>{const cs=getComputedStyle(e),height=e.getBoundingClientRect().height,line=parseFloat(cs.lineHeight)||0;return{row,col,text:e.innerText,align:cs.textAlign,whiteSpace:cs.whiteSpace,width:+e.getBoundingClientRect().width.toFixed(1),height:+height.toFixed(1),paddingInline:cs.paddingInline,paddingBlock:cs.paddingBlock,estimatedLines:line?Math.max(1,Math.round((height-2*parseFloat(cs.paddingBlock)-1)/line)):null}}));const last=t.querySelector('thead th:last-child');const lr=last.getBoundingClientRect(),wr=w.getBoundingClientRect();const report={url,caption:t.querySelector('caption')?.innerText||'',viewport:innerWidth,document:{clientWidth:d.documentElement.clientWidth,scrollWidth:d.documentElement.scrollWidth,bodyScrollWidth:d.body.scrollWidth},table:rect(t),scroll:{clientWidth:w.clientWidth,scrollWidth:w.scrollWidth,scrollLeft:w.scrollLeft,maxScroll:w.scrollWidth-w.clientWidth,focus:d.activeElement===w,role:w.getAttribute('role'),tabIndex:w.tabIndex,lastColumnVisible:lr.left>=wr.left-1&&lr.right<=wr.right+1,lastColumnRect:rect(last),regionRect:rect(w)},cells,descriptionCells:desc,lastColumnCells:lastCells,dataCells,data:[...t.querySelectorAll('tr')].map(r=>[...r.cells].map(c=>c.innerText))};out.textContent=JSON.stringify(report);window.tableReport=report}catch(e){out.textContent='측정 오류: '+e}}
frame.addEventListener('load',()=>setTimeout(measure,100));document.querySelector('#focus').onclick=()=>{const d=frame.contentDocument,all=[...d.querySelectorAll('table')],index={ 'docs-reference':0,'api-reference':0,'admin-table':0,'sales-dashboard':2 }[id]??0,t=name?all[0]:(variant==='after'?d.querySelector('table[data-table-min]'):all[index]),w=t?.closest('.kit-table-scroll');w.focus();t.scrollIntoView({block:'center'});measure()};document.querySelector('#scroll').onclick=()=>{const d=frame.contentDocument,all=[...d.querySelectorAll('table')],index={ 'docs-reference':0,'api-reference':0,'admin-table':0,'sales-dashboard':2 }[id]??0,t=name?all[0]:(variant==='after'?d.querySelector('table[data-table-min]'):all[index]),w=t?.closest('.kit-table-scroll');w.focus();t.scrollIntoView({block:'center'});w.scrollLeft=w.scrollWidth;measure()};window.addEventListener('resize',()=>setTimeout(measure,100));
</script></html>
