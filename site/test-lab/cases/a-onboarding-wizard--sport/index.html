s="kit-check-row"><input type="radio" name="level" value="조금 해 봤어요"><span>조금 해 봤어요</span></label><label class="kit-check-row"><input type="radio" name="level" value="꽤 익숙해요"><span>꽤 익숙해요</span></label></fieldset><div class="kit-field"><label for="field-topics">관심 분야 <span class="kit-muted">(필수)</span></label><select id="field-topics" name="topics" required><option value="">선택해 주세요</option><option>웹</option><option>데이터</option><option>디자인</option><option>모바일</option></select></div><div class="kit-field kit-choice"><label class="kit-switch" for="field-daily"><input type="checkbox" role="switch" id="field-daily" name="daily"><i aria-hidden="true"></i><span>매일 알림 받기 <span class="kit-muted">(선택)</span></span></label></div></div><button class="kit-button" data-variant="primary" type="submit">다음</button><p class="kit-form-status" role="status" aria-live="polite"></p><noscript>데모 입력 확인은 JavaScript가 필요합니다.</noscript></form><div class="kit-actions" data-align="start"><a class="kit-button" data-variant="ghost" href="#main">건너뛰기</a></div></main><footer class="kit-footer" id="kit-footer"><div><strong>러닝메이트</strong><p>러닝메이트 · Static Kit 2.0.0</p></div><nav aria-label="바로가기"><strong>바로가기</strong><ul><li><a href="#main">도움말</a></li></ul></nav><nav aria-label="안내"><strong>안내</strong><ul class="kit-footer-links"><li><a href="#main">이용약관</a></li><li><a href="#main">개인정보</a></li><li><a href="#main">문의</a></li></ul></nav></footer></div></div><script>document.querySelectorAll('.kit-form').forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();var s=form.querySelector('[role=status]');if(form.reportValidity()){s.textContent='입력 형식을 확인했습니다. 데모이므로 저장하지 않았습니다.';}else{s.textContent='';}});});document.querySelectorAll('[data-tabs]').forEach(function(root){var tabs=[].slice.call(root.querySelectorAll('[role=tab]')),panels=[].slice.call(root.querySelectorAll('[role=tabpanel]'));function pick(i,focus){tabs.forEach(function(t,j){var on=i===j;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;panels[j].hidden=!on;});if(focus)tabs[i].focus();}tabs.forEach(function(t,i){t.addEventListener('click',function(){pick(i,false);});t.addEventListener('keydown',function(e){var n=tabs.length,k=e.key;if(k==='ArrowRight')pick((i+1)%n,true);else if(k==='ArrowLeft')pick((i+n-1)%n,true);else if(k==='Home')pick(0,true);else if(k==='End')pick(n-1,true);else return;e.preventDefault();});});});document.querySelectorAll('.kit-chips').forEach(function(g){var bs=[].slice.call(g.querySelectorAll('button'));bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});});});});var megas=[].slice.call(document.querySelectorAll('.kit-mega'));megas.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)megas.forEach(function(o){if(o!==d)o.open=false;});});d.addEventListener('keydown',function(e){if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}});});document.addEventListener('click',function(e){megas.forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
