alse">디자인</button><button type="button" aria-pressed="false">개발</button><button type="button" aria-pressed="false">운영</button></div></div><section class="kit-team" aria-labelledby="block-4-title"><h2 id="block-4-title">구성원</h2><ul><li><span class="kit-avatar" aria-hidden="true">김</span><div><strong>김다선</strong><span class="kit-muted">디자인 리드</span><p>디자인 시스템</p></div></li><li><span class="kit-avatar" aria-hidden="true">이</span><div><strong>이지훈</strong><span class="kit-muted">프런트엔드</span><p>컴포넌트 라이브러리</p></div></li><li><span class="kit-avatar" aria-hidden="true">박</span><div><strong>박서연</strong><span class="kit-muted">모션 디자이너</span><p>인터랙션</p></div></li><li><span class="kit-avatar" aria-hidden="true">최</span><div><strong>최민준</strong><span class="kit-muted">리서처</span><p>사용성 조사</p></div></li><li><span class="kit-avatar" aria-hidden="true">정</span><div><strong>정하늘</strong><span class="kit-muted">백엔드</span><p>API</p></div></li><li><span class="kit-avatar" aria-hidden="true">한</span><div><strong>한유진</strong><span class="kit-muted">운영</span><p>고객 지원</p></div></li></ul></section><nav class="kit-pagination" aria-label="페이지 이동"><ul><li><a href="#main" aria-label="이전 페이지" aria-disabled="true"><svg class="kit-icon kit-flip" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></a></li><li><a href="#main" aria-current="page">1<span class="kit-sr"> 페이지</span></a></li><li><a href="#main">2<span class="kit-sr"> 페이지</span></a></li><li><a href="#main" aria-label="다음 페이지"><svg class="kit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 6l6 6-6 6"/></svg></a></li></ul></nav></main><footer class="kit-footer" id="kit-footer"><p>허브 · 정적 데모</p></footer></div></div><script>document.querySelectorAll('.kit-form').forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();var s=form.querySelector('[role=status]');if(form.reportValidity()){s.textContent='입력 형식을 확인했습니다. 데모이므로 저장하지 않았습니다.';}else{s.textContent='';}});});document.querySelectorAll('[data-tabs]').forEach(function(root){var tabs=[].slice.call(root.querySelectorAll('[role=tab]')),panels=[].slice.call(root.querySelectorAll('[role=tabpanel]'));function pick(i,focus){tabs.forEach(function(t,j){var on=i===j;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;panels[j].hidden=!on;});if(focus)tabs[i].focus();}tabs.forEach(function(t,i){t.addEventListener('click',function(){pick(i,false);});t.addEventListener('keydown',function(e){var n=tabs.length,k=e.key;if(k==='ArrowRight')pick((i+1)%n,true);else if(k==='ArrowLeft')pick((i+n-1)%n,true);else if(k==='Home')pick(0,true);else if(k==='End')pick(n-1,true);else return;e.preventDefault();});});});document.querySelectorAll('.kit-chips').forEach(function(g){var bs=[].slice.call(g.querySelectorAll('button'));bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});});});});var megas=[].slice.call(document.querySelectorAll('.kit-mega'));megas.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)megas.forEach(function(o){if(o!==d)o.open=false;});});d.addEventListener('keydown',function(e){if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}});});document.addEventListener('click',function(e){megas.forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
