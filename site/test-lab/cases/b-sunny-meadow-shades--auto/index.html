,function(){var box=b.closest('.kit-code'),pre=box.querySelector('pre'),text=pre.innerText,st=box.querySelector('[data-copy-status]');function done(){b.setAttribute('data-done','true');if(st)st.textContent='코드를 복사했습니다.';setTimeout(function(){b.removeAttribute('data-done');if(st)st.textContent='';},1800);}function fallback(){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);try{if(document.execCommand('copy'))done();}catch(e){}s.removeAllRanges();}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback);}else{fallback();}});});var megas=[].slice.call(document.querySelectorAll('.kit-mega'));megas.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)megas.forEach(function(o){if(o!==d)o.open=false;});});d.addEventListener('keydown',function(e){if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}});});document.addEventListener('click',function(e){megas.forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
