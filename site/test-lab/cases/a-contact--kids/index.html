ld-email" name="email" type="email" required maxlength="200" placeholder="name@example.com" autocomplete="email"></div><div class="kit-field"><label for="field-topic">문의 유형 <span class="kit-muted">(필수)</span></label><select id="field-topic" name="topic" required><option value="">선택해 주세요</option><option>진료 문의</option><option>예약 변경</option><option>기타</option></select></div><div class="kit-field"><label for="field-body">내용 <span class="kit-muted">(필수)</span></label><textarea id="field-body" name="body" required maxlength="2000" placeholder="문의하실 내용을 적어 주세요" aria-describedby="field-body-help"></textarea><p class="kit-help" id="field-body-help">개인정보는 적지 않아도 됩니다.</p></div><div class="kit-field kit-choice"><label class="kit-check-row" for="field-agree"><input type="checkbox" id="field-agree" name="agree"><span>개인정보 수집에 동의합니다 <span class="kit-muted">(선택)</span></span></label></div></div><button class="kit-button" data-variant="primary" type="submit">입력 확인</button><p class="kit-form-status" role="status" aria-live="polite"></p><noscript>데모 입력 확인은 JavaScript가 필요합니다.</noscript></form></div><aside class="kit-aside-side" aria-label="연락처"><section class="kit-props" data-layout="stacked" aria-labelledby="block-5-title"><h2 id="block-5-title">연락처</h2><dl><div><dt>전화</dt><dd>02-000-0000</dd></div><div><dt>운영 시간</dt><dd>평일 09:00~18:00</dd></div><div><dt>점심시간</dt><dd>13:00~14:00</dd></div><div><dt>주소</dt><dd>서울 성동구 예시로 5, 2층</dd></div></dl></section></aside></div></main><footer class="kit-footer" id="kit-footer"><div><strong>맑은숨</strong><p>© 2026 맑은숨 내과의원</p></div><nav aria-label="바로가기"><strong>바로가기</strong><ul><li><a href="#main">진료안내</a></li><li><a href="#main">예약</a></li><li><a href="#main">문의</a></li></ul></nav><nav aria-label="안내"><strong>안내</strong><ul class="kit-footer-links"><li><a href="#main">이용약관</a></li><li><a href="#main">개인정보</a></li><li><a href="#main">문의</a></li></ul></nav></footer></div></div><script>document.querySelectorAll('.kit-form').forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();var s=form.querySelector('[role=status]');if(form.reportValidity()){s.textContent='입력 형식을 확인했습니다. 데모이므로 저장하지 않았습니다.';}else{s.textContent='';}});});document.querySelectorAll('[data-tabs]').forEach(function(root){var tabs=[].slice.call(root.querySelectorAll('[role=tab]')),panels=[].slice.call(root.querySelectorAll('[role=tabpanel]'));function pick(i,focus){tabs.forEach(function(t,j){var on=i===j;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;panels[j].hidden=!on;});if(focus)tabs[i].focus();}tabs.forEach(function(t,i){t.addEventListener('click',function(){pick(i,false);});t.addEventListener('keydown',function(e){var n=tabs.length,k=e.key;if(k==='ArrowRight')pick((i+1)%n,true);else if(k==='ArrowLeft')pick((i+n-1)%n,true);else if(k==='Home')pick(0,true);else if(k==='End')pick(n-1,true);else return;e.preventDefault();});});});document.querySelectorAll('.kit-chips').forEach(function(g){var bs=[].slice.call(g.querySelectorAll('button'));bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});});});});document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){var box=b.closest('.kit-code'),pre=box.querySelector('pre'),text=pre.innerText,st=box.querySelector('[data-copy-status]');function done(){b.setAttribute('data-done','true');if(st)st.textContent='코드를 복사했습니다.';setTimeout(function(){b.removeAttribute('data-done');if(st)st.textContent='';},1800);}function fallback(){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);try{if(document.execCommand('copy'))done();}catch(e){}s.removeAllRanges();}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback);}else{fallback();}});});var megas=[].slice.call(document.querySelectorAll('.kit-mega'));megas.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)megas.forEach(function(o){if(o!==d)o.open=false;});});d.addEventListener('keydown',function(e){if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}});});document.addEventListener('click',function(e){megas.forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
