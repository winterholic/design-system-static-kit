"보통"><span>보통</span></label><label class="kit-check-row"><input type="radio" name="rate" value="불만족"><span>불만족</span></label></fieldset><div class="kit-field"><label for="field-feature">가장 유용한 기능 <span class="kit-muted">(필수)</span></label><select id="field-feature" name="feature" required><option value="">선택해 주세요</option><option>검색</option><option>알림</option><option>공유</option><option>자동화</option></select></div><div class="kit-field"><label for="field-comment">개선했으면 하는 점 <span class="kit-muted">(선택)</span></label><textarea id="field-comment" name="comment" maxlength="2000" placeholder="자유롭게 적어 주세요"></textarea></div></div><button class="kit-button" data-variant="primary" type="submit">다음 문항</button><p class="kit-form-status" role="status" aria-live="polite"></p><noscript>데모 입력 확인은 JavaScript가 필요합니다.</noscript></form></main><footer class="kit-footer" id="kit-footer"><p>© 2026 의견 듣기</p><ul class="kit-footer-links"><li><a href="#main">이용약관</a></li><li><a href="#main">개인정보</a></li><li><a href="#main">문의</a></li></ul></footer></div></div><script>document.querySelectorAll('.kit-form').forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();var s=form.querySelector('[role=status]');if(form.reportValidity()){s.textContent='입력 형식을 확인했습니다. 데모이므로 저장하지 않았습니다.';}else{s.textContent='';}});});document.querySelectorAll('[data-tabs]').forEach(function(root){var tabs=[].slice.call(root.querySelectorAll('[role=tab]')),panels=[].slice.call(root.querySelectorAll('[role=tabpanel]'));function pick(i,focus){tabs.forEach(function(t,j){var on=i===j;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;panels[j].hidden=!on;});if(focus)tabs[i].focus();}tabs.forEach(function(t,i){t.addEventListener('click',function(){pick(i,false);});t.addEventListener('keydown',function(e){var n=tabs.length,k=e.key;if(k==='ArrowRight')pick((i+1)%n,true);else if(k==='ArrowLeft')pick((i+n-1)%n,true);else if(k==='Home')pick(0,true);else if(k==='End')pick(n-1,true);else return;e.preventDefault();});});});document.querySelectorAll('.kit-chips').forEach(function(g){var bs=[].slice.call(g.querySelectorAll('button'));bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});});});});var megas=[].slice.call(document.querySelectorAll('.kit-mega'));megas.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)megas.forEach(function(o){if(o!==d)o.open=false;});});d.addEventListener('keydown',function(e){if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}});});document.addEventListener('click',function(e){megas.forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
