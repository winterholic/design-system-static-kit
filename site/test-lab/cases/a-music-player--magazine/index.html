class="a-1"/><rect x="-34" y="31" width="68" height="2.6" rx="1.3" class="a-3" opacity=".8"/><rect x="-34" y="36" width="44" height="2.2" rx="1.1" class="a-4" opacity=".5"/><path d="M-36 -28H-22M-36 -23H-27" class="k4" stroke-width="2" opacity=".5"/></g><defs><radialGradient id="g0v" cx=".5" cy=".5" r=".78"><stop offset=".5" class="sk" stop-opacity="0"/><stop offset="1" class="sk" stop-opacity=".2"/></radialGradient></defs><path d="M166.4 0H243.2L128 320H57.6Z" class="a-hi" opacity=".3"/><path d="M262.4 0H281.6L160 320H140.8Z" class="a-hi" opacity=".18"/><rect width="320" height="320" fill="url(#g0v)"/></svg></div><figcaption>지금 재생 중: 새벽의 끝</figcaption></figure></div><div class="kit-split-cell"><section class="kit-list" data-variant="card" aria-labelledby="block-5-title"><h2 id="block-5-title">재생 목록</h2><ul><li><span class="kit-li-icon"><svg class="kit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l11-2v13"/><path class="c" d="M4 18a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/><path class="c" d="M15 16a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/></svg></span><div><strong>새벽의 끝</strong><p>03:42</p></div><span class="kit-badge" data-status="진행" data-dot="info">진행</span></li><li><span class="kit-li-icon"><svg class="kit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l11-2v13"/><path class="c" d="M4 18a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/><path class="c" d="M15 16a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/></svg></span><div><strong>불 꺼진 도시</strong><p>04:05</p></div></li><li><span class="kit-li-icon"><svg class="kit-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18V5l11-2v13"/><path class="c" d="M4 18a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/><path class="c" d="M15 16a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0Z"/></svg></span><div><strong>창가의 비</strong><p>03:18</p></div></li></ul></section></div></div><div class="kit-progress"><div class="kit-progress-head"><span id="pr-6">재생 위치</span><strong>38%</strong></div><div class="kit-track" role="progressbar" aria-labelledby="pr-6" aria-valuemin="0" aria-valuemax="100" aria-valuenow="38" aria-valuetext="01:24 / 03:42"><span class="kit-bar" style="width:38%" data-tone="brand"></span></div><p class="kit-muted">01:24 / 03:42</p></div><div class="kit-actions" data-align="center"><a class="kit-button" data-variant="ghost" href="#main">이전</a><a class="kit-button" data-variant="primary" href="#main">재생</a><a class="kit-button" data-variant="ghost" href="#main">다음</a></div></main><footer class="kit-footer" id="kit-footer"><div><strong>녹턴</strong><p>녹턴 · 정적 데모</p></div><nav aria-label="바로가기"><strong>바로가기</strong><ul><li><a href="#main">홈</a></li><li><a href="#main">검색</a></li><li><a href="#main">보관함</a></li></ul></nav><nav aria-label="안내"><strong>안내</strong><ul class="kit-footer-links"><li><a href="#main">이용약관</a></li><li><a href="#main">개인정보</a></li><li><a href="#main">문의</a></li></ul></nav></footer></div></div><script>document.querySelectorAll('.kit-form').forEach(function(form){form.addEventListener('submit',function(event){event.preventDefault();var s=form.querySelector('[role=status]');if(form.reportValidity()){s.textContent='입력 형식을 확인했습니다. 데모이므로 저장하지 않았습니다.';}else{s.textContent='';}});});document.querySelectorAll('[data-tabs]').forEach(function(root){var tabs=[].slice.call(root.querySelectorAll('[role=tab]')),panels=[].slice.call(root.querySelectorAll('[role=tabpanel]'));function pick(i,focus){tabs.forEach(function(t,j){var on=i===j;t.setAttribute('aria-selected',on?'true':'false');t.tabIndex=on?0:-1;panels[j].hidden=!on;});if(focus)tabs[i].focus();}tabs.forEach(function(t,i){t.addEventListener('click',function(){pick(i,false);});t.addEventListener('keydown',function(e){var n=tabs.length,k=e.key;if(k==='ArrowRight')pick((i+1)%n,true);else if(k==='ArrowLeft')pick((i+n-1)%n,true);else if(k==='Home')pick(0,true);else if(k==='End')pick(n-1,true);else return;e.preventDefault();});});});document.querySelectorAll('.kit-chips').forEach(function(g){var bs=[].slice.call(g.querySelectorAll('button'));bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(o){o.setAttribute('aria-pressed',o===b?'true':'false');});});});});document.querySelectorAll('[data-copy]').forEach(function(b){b.addEventListener('click',function(){var box=b.closest('.kit-code'),pre=box.querySelector('pre'),text=pre.innerText,st=box.querySelector('[data-copy-status]');function done(){b.setAttribute('data-done','true');if(st)st.textContent='코드를 복사했습니다.';setTimeout(function(){b.removeAttribute('data-done');if(st)st.textContent='';},1800);}function fallback(){var r=document.createRange();r.selectNodeContents(pre);var s=window.getSelection();s.removeAllRanges();s.addRange(r);try{if(document.execCommand('copy'))done();}catch(e){}s.removeAllRanges();}if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(done,fallback);}else{fallback();}});});var megas=[].slice.call(document.querySelectorAll('.kit-mega'));megas.forEach(function(d){d.addEventListener('toggle',function(){if(d.open)megas.forEach(function(o){if(o!==d)o.open=false;});});d.addEventListener('keydown',function(e){if(e.key==='Escape'){d.open=false;d.querySelector('summary').focus();}});});document.addEventListener('click',function(e){megas.forEach(function(d){if(d.open&&!d.contains(e.target))d.open=false;});});</script></body></html>
